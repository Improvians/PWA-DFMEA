<!doctype html><html><head><meta charset="utf-8">
<script>
(function(){
  try{
    var auth = JSON.parse(localStorage.getItem("dfmeaAuth") || "null");
    if(!auth || !auth.loggedIn) window.location.replace("login.html");
  }catch(error){ window.location.replace("login.html"); }
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css">
<style>
.rv-wrap{max-width:680px;margin:28px auto;padding:0 22px}
.rv-card{background:#fff;border:1px solid #E4EAF2;border-radius:12px;padding:22px 24px}
.rv-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px}
.rv-prod{font-size:18px;font-weight:800;color:#1E293B}
.rv-meta{font-size:11px;color:#94A3B8;margin-bottom:18px}
.np-standard{display:inline-flex;align-items:center;padding:3px 10px;border-radius:6px;background:#EEF2FF;color:#4338CA;font-size:11px;font-weight:700}
.np-speclist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.np-speclist li{display:flex;align-items:flex-start;gap:9px;font-size:12.5px;color:#334155;line-height:1.6}
.np-speclist li svg{flex:none;margin-top:2px;color:#16A34A}
.rv-link{font-size:11.5px;font-weight:700;color:#4338CA;text-decoration:none;margin-top:18px;display:inline-block}
.rv-notfound{text-align:center;color:#94A3B8;padding:60px 20px}
</style>
</head>
<body><div class="app">
<div class="main">
  <div style="display:flex;align-items:center;gap:8px;padding:9px 22px;border-bottom:1px solid #E4EAF2;background:#fff">
    <div class="logo" style="width:22px;height:22px;color:#4F46E5"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h6l5 5v11a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M14 3v5h5"/><path d="M9.5 13.5l2 2 3.5-4"/></svg></div>
    <span style="font-size:11.5px;font-weight:700;color:#1E293B">DFMEA Studio</span>
    <span style="font-size:11px;color:#CBD5E1">&middot;</span>
    <a href="upload.html" style="font-size:11px;font-weight:600;color:#4338CA;text-decoration:none">&lsaquo; Back to Data Warehouse</a>
  </div>
  <div class="rv-wrap" id="rvWrap"></div>
</div>
</div>
<script>
(function(){
  "use strict";
  var params = new URLSearchParams(window.location.search);
  var id = params.get("id") || "";

  var DEFAULT_REQ_LIBRARY = [
    { id: "default-0", product: "Titan Connector Housing", standard: "USCAR-2", when: "Feb 11, 2024", specs: [
      "Housing material flammability rating UL94 V-0",
      "Housing sealing rated to IP67 at the connector mating face",
      "Minimum 50 mating/unmating cycles without contact degradation",
      "Operating temperature range -40°C to +105°C"
    ]},
    { id: "default-1", product: "Nova Terminal Block", standard: "LV214", when: "Sep 3, 2024", specs: [
      "Crimp pull-out force ≥ 70 N per terminal",
      "Contact resistance ≤ 0.6 mΩ after crimping",
      "Terminal retention force ≥ 55 N in the housing cavity",
      "Salt spray resistance per ISO 9227, 96h minimum"
    ]}
  ];
  function escapeHtml(value){
    var div = document.createElement("div");
    div.textContent = String(value);
    return div.innerHTML;
  }
  function readRequirementDocs(){
    try{ return JSON.parse(localStorage.getItem("dfmeaRequirementDocs") || "[]"); }catch(error){ return []; }
  }
  function readMyProjects(){
    try{ return JSON.parse(localStorage.getItem("dfmeaMyProjects") || "[]"); }catch(error){ return []; }
  }

  var doc = DEFAULT_REQ_LIBRARY.find(function(d){ return d.id === id; });
  if(!doc){
    var real = readRequirementDocs().find(function(r){ return r.id === id; });
    if(real){
      var project = readMyProjects().find(function(p){ return p.id === real.projectId; });
      doc = { product: real.productName, standard: real.standard, when: real.createdAt, specs: real.specs, projectId: project ? real.projectId : null };
    }
  }

  var wrap = document.getElementById("rvWrap");
  if(!doc){
    wrap.innerHTML = '<div class="rv-notfound">This specification could not be found.</div>';
    return;
  }
  var standardLabel = doc.standard === "None" ? "No specific standard" : doc.standard;
  document.title = doc.product + " - DFMEA Studio";
  wrap.innerHTML = '<div class="rv-card">'
    + '<div class="rv-head"><span class="rv-prod">' + escapeHtml(doc.product) + '</span><span class="np-standard">' + escapeHtml(standardLabel) + '</span></div>'
    + '<div class="rv-meta">Design requirement specification &middot; ' + escapeHtml(doc.when) + '</div>'
    + '<ul class="np-speclist">' + (doc.specs || []).map(function(s){
        return '<li><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>' + escapeHtml(s) + '</li>';
      }).join("") + '</ul>'
    + (doc.projectId ? '<a class="rv-link" href="project.html?id=' + encodeURIComponent(doc.projectId) + '">View project &rsaquo;</a>' : "")
    + '</div>';
})();
</script>
</body></html>
